<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ACP</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro", system-ui, sans-serif;
  background: #0d1117; color: #e6edf3;
  height: 100dvh; display: flex; flex-direction: column;
  overflow: hidden;
}

/* Status bar */
#status {
  padding: 6px 16px; font-size: 12px; color: #8b949e;
  border-bottom: 1px solid #21262d; flex-shrink: 0;
  display: flex; justify-content: space-between; align-items: center;
}
#status.connected { color: #3fb950; }
#status.error { color: #f85149; }
#status .cancel-btn {
  background: #da3633; color: #fff; border: none; border-radius: 6px;
  padding: 4px 12px; font-size: 12px; cursor: pointer; display: none;
}
#status .cancel-btn.visible { display: inline-block; }
#status .cancel-btn:active { background: #b62324; }

/* Messages area */
#messages {
  flex: 1; overflow-y: auto; padding: 12px 16px;
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
}

/* Message bubbles */
.msg {
  margin-bottom: 12px; max-width: 88%; line-height: 1.5;
  padding: 10px 14px; border-radius: 16px; word-wrap: break-word;
  overflow-wrap: break-word;
}
.msg.user {
  background: #1f6feb; color: #fff; align-self: flex-end;
  margin-left: auto; border-bottom-right-radius: 4px;
}
.msg.agent {
  background: #161b22; border: 1px solid #21262d;
  border-bottom-left-radius: 4px;
}
.msg.thought {
  background: transparent; color: #8b949e; font-style: italic;
  font-size: 13px; padding: 4px 14px; max-width: 100%;
}
.msg.system {
  background: transparent; color: #8b949e; font-size: 12px;
  text-align: center; max-width: 100%; padding: 4px 0;
}

/* Tool calls */
.msg.tool {
  background: #0d1117; border-left: 3px solid #d2a8ff;
  border-radius: 8px; padding: 8px 12px; max-width: 100%;
  font-size: 13px; cursor: pointer; user-select: none;
  -webkit-user-select: none;
}
.msg.tool .tool-header {
  display: flex; align-items: center; gap: 8px;
}
.msg.tool .tool-icon { font-size: 14px; flex-shrink: 0; }
.msg.tool .tool-name {
  font-family: "SF Mono", Menlo, monospace; font-size: 12px;
  color: #d2a8ff; flex: 1; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}
.msg.tool .tool-expand { color: #484f58; font-size: 10px; }
.msg.tool .tool-body {
  display: none; margin-top: 8px; padding-top: 8px;
  border-top: 1px solid #21262d;
  font-family: "SF Mono", Menlo, monospace; font-size: 11px;
  color: #8b949e; white-space: pre-wrap; max-height: 300px;
  overflow-y: auto; line-height: 1.4;
}
.msg.tool.expanded .tool-body { display: block; }
.msg.tool.expanded .tool-expand::after { content: ""; }
.msg.tool .tool-status { font-size: 11px; color: #8b949e; }
.msg.tool .tool-status.running { color: #d29922; }
.msg.tool .tool-status.completed { color: #3fb950; }
.msg.tool .tool-status.failed { color: #f85149; }

/* Thinking indicator */
#thinking {
  display: none; padding: 8px 16px;
  border-top: 1px solid #21262d; flex-shrink: 0;
}
#thinking.visible { display: flex; align-items: center; gap: 8px; }
#thinking .dots { color: #58a6ff; font-size: 14px; }
#thinking .dots span {
  animation: blink 1.4s infinite both;
  display: inline-block;
}
#thinking .dots span:nth-child(2) { animation-delay: 0.2s; }
#thinking .dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%,80%,100% { opacity: 0.2; } 40% { opacity: 1; } }
#thinking .label { color: #8b949e; font-size: 13px; font-style: italic; }

/* Scroll-to-bottom button */
#scroll-btn {
  display: none; position: fixed; bottom: 80px; right: 16px;
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(31,111,235,0.9); border: none; color: #fff;
  font-size: 18px; cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  z-index: 10;
}
#scroll-btn.visible { display: flex; align-items: center; justify-content: center; }
#scroll-btn:active { background: rgba(31,111,235,1); }

/* Input area */
#input-area {
  border-top: 1px solid #21262d; padding: 10px 12px;
  display: flex; gap: 8px; flex-shrink: 0;
  padding-bottom: max(10px, env(safe-area-inset-bottom));
  background: #0d1117;
}
#prompt {
  flex: 1; background: #161b22; border: 1px solid #30363d;
  border-radius: 20px; color: #e6edf3; padding: 10px 16px;
  font-size: 16px; font-family: inherit; resize: none;
  min-height: 44px; max-height: 120px; line-height: 1.4;
}
#prompt:focus { outline: none; border-color: #58a6ff; }
#prompt::placeholder { color: #484f58; }
#send {
  background: #238636; border: none; border-radius: 50%;
  color: white; width: 44px; height: 44px; font-size: 18px;
  cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
#send:active { background: #2ea043; }
#send:disabled { background: #21262d; color: #484f58; }

/* Markdown in agent messages */
.msg.agent pre {
  background: #0d1117; border: 1px solid #21262d;
  border-radius: 6px; padding: 10px; margin: 6px 0;
  overflow-x: auto; font-size: 12px; line-height: 1.4;
}
.msg.agent code {
  font-family: "SF Mono", Menlo, monospace; font-size: 13px;
}
.msg.agent code:not(pre code) {
  background: #1a1f2b; padding: 2px 5px; border-radius: 3px;
  color: #f0883e; font-size: 12px;
}
.msg.agent strong { font-weight: 600; }
.msg.agent em { font-style: italic; }
.msg.agent a { color: #58a6ff; text-decoration: underline; }
.msg.agent ul, .msg.agent ol {
  margin: 4px 0; padding-left: 20px;
}
.msg.agent li { margin: 2px 0; }
.msg.agent h1, .msg.agent h2, .msg.agent h3 {
  margin: 8px 0 4px 0; font-weight: 600;
}
.msg.agent h1 { font-size: 18px; }
.msg.agent h2 { font-size: 16px; }
.msg.agent h3 { font-size: 15px; }
.msg.agent blockquote {
  border-left: 3px solid #30363d; padding-left: 12px;
  color: #8b949e; margin: 6px 0;
}
.msg.agent hr {
  border: none; border-top: 1px solid #21262d; margin: 8px 0;
}
</style>
</head>
<body>
<div id="status">
  <span id="status-text">Connecting...</span>
  <button class="cancel-btn" id="cancel-btn" onclick="cancelPrompt()">Cancel</button>
</div>
<div id="messages"></div>
<div id="thinking"><div class="dots"><span>.</span><span>.</span><span>.</span></div><span class="label">Thinking</span></div>
<button id="scroll-btn" onclick="scrollToBottom()">&#8595;</button>
<div id="input-area">
  <textarea id="prompt" rows="1" placeholder="Message..." enterkeyhint="send"></textarea>
  <button id="send" disabled onclick="sendPrompt()">&#9652;</button>
</div>

<script>
const messagesEl = document.getElementById('messages');
const statusText = document.getElementById('status-text');
const statusEl = document.getElementById('status');
const promptEl = document.getElementById('prompt');
const sendBtn = document.getElementById('send');
const cancelBtn = document.getElementById('cancel-btn');
const thinkingEl = document.getElementById('thinking');
const scrollBtn = document.getElementById('scroll-btn');

let ws, nextId = 100, sessionId = null;
let currentAgentMsg = null;
let processing = false;
let reconnectAttempts = 0;
let reconnectTimer = null;
let isAtBottom = true;

// --- Markdown renderer (basic, no dependencies) ---

function renderMarkdown(text) {
  // Escape HTML first
  let html = text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  // Fenced code blocks (``` ... ```)
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
    return '<pre><code>' + code.trimEnd() + '</code></pre>';
  });

  // Inline code (`...`)
  html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');

  // Headings
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

  // Horizontal rule
  html = html.replace(/^---+$/gm, '<hr>');

  // Bold and italic
  html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');

  // Links
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

  // Blockquotes
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');

  // Unordered lists (simple: lines starting with - or *)
  html = html.replace(/^(?:- |\* )(.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');

  // Ordered lists (lines starting with 1. 2. etc)
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  // Wrap consecutive <li> not already in <ul> into <ol>
  html = html.replace(/(?<!<\/ul>)(<li>.*<\/li>\n?)+/g, (match) => {
    if (html.indexOf('<ul>' + match) === -1) return '<ol>' + match + '</ol>';
    return match;
  });

  // Paragraphs: double newlines
  html = html.replace(/\n\n+/g, '</p><p>');
  // Single newlines to <br> (but not inside pre/code)
  html = html.replace(/(?<!<\/pre>|<\/code>|<\/h[123]>|<\/li>|<\/ul>|<\/ol>|<\/blockquote>|<\/hr>)\n(?!<pre|<h[123]|<li|<ul|<ol|<blockquote|<hr)/g, '<br>');

  return '<p>' + html + '</p>';
}

function escHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// --- Message display ---

function addMsg(cls, content) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  if (cls === 'agent') {
    d.innerHTML = renderMarkdown(content);
  } else {
    d.textContent = content;
  }
  messagesEl.appendChild(d);
  if (isAtBottom) scrollToBottom();
  return d;
}

function addToolMsg(toolName) {
  const d = document.createElement('div');
  d.className = 'msg tool';
  d.innerHTML =
    '<div class="tool-header">' +
      '<span class="tool-icon">&#9881;</span>' +
      '<span class="tool-name">' + escHtml(toolName) + '</span>' +
      '<span class="tool-status running">running</span>' +
      '<span class="tool-expand">&#9656;</span>' +
    '</div>' +
    '<div class="tool-body"></div>';
  d.onclick = () => d.classList.toggle('expanded');
  messagesEl.appendChild(d);
  if (isAtBottom) scrollToBottom();
  return d;
}

function updateToolStatus(toolEl, status, content) {
  const statusEl = toolEl.querySelector('.tool-status');
  if (statusEl) {
    statusEl.textContent = status;
    statusEl.className = 'tool-status ' + status;
  }
  if (content) {
    const body = toolEl.querySelector('.tool-body');
    if (body) body.textContent = content;
  }
}

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
  scrollBtn.classList.remove('visible');
  isAtBottom = true;
}

// Scroll tracking
messagesEl.addEventListener('scroll', () => {
  const distFromBottom = messagesEl.scrollHeight - messagesEl.clientHeight - messagesEl.scrollTop;
  isAtBottom = distFromBottom < 60;
  scrollBtn.classList.toggle('visible', !isAtBottom);
});

function setProcessing(v) {
  processing = v;
  thinkingEl.classList.toggle('visible', v);
  cancelBtn.classList.toggle('visible', v);
}

// --- WebSocket & ACP protocol ---

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host + '/ws');

  ws.onopen = () => {
    statusText.textContent = 'Connected';
    statusEl.className = 'connected';
    reconnectAttempts = 0;
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    handleMessage(msg);
  };

  ws.onclose = () => {
    statusText.textContent = 'Disconnected';
    statusEl.className = 'error';
    sendBtn.disabled = true;
    setProcessing(false);
    scheduleReconnect();
  };

  ws.onerror = () => {
    statusText.textContent = 'Connection error';
    statusEl.className = 'error';
  };
}

function scheduleReconnect() {
  if (reconnectTimer) return;
  const delay = Math.min(60000, 2000 * Math.pow(2, reconnectAttempts));
  reconnectAttempts++;
  reconnectTimer = setTimeout(() => {
    reconnectTimer = null;
    // Clear messages on reconnect -- replay will repopulate
    messagesEl.innerHTML = '';
    currentAgentMsg = null;
    sessionId = null;
    connect();
  }, delay);
}

function handleMessage(msg) {
  // Response (has id + result/error)
  if (msg.id !== undefined && (msg.result !== undefined || msg.error !== undefined)) {
    if (msg.error) {
      addMsg('system', 'Error: ' + (msg.error.message || JSON.stringify(msg.error)));
      setProcessing(false);
      return;
    }

    // Initialize response
    if (msg.result && msg.result.agentInfo) {
      const info = msg.result.agentInfo;
      addMsg('system', (info.name || 'Agent') + ' ' + (info.version || ''));
    }

    // Session/new response
    if (msg.result && msg.result.sessionId) {
      sessionId = msg.result.sessionId;
      sendBtn.disabled = false;
    }

    // Prompt response (stopReason)
    if (msg.result && msg.result.stopReason) {
      currentAgentMsg = null;
      setProcessing(false);
    }
    return;
  }

  // Notification: session/update
  if (msg.method === 'session/update' && msg.params) {
    const update = msg.params.update;
    if (!update) return;

    // Extract sessionId from updates if we don't have it yet
    if (!sessionId && msg.params.sessionId) {
      sessionId = msg.params.sessionId;
      sendBtn.disabled = false;
    }

    const kind = update.sessionUpdate;
    const text = (update.content && update.content.text) || update.text || '';

    switch (kind) {
      case 'agent_message_chunk':
        if (!currentAgentMsg) {
          currentAgentMsg = addMsg('agent', '');
          currentAgentMsg._text = '';
        }
        currentAgentMsg._text += text;
        currentAgentMsg.innerHTML = renderMarkdown(currentAgentMsg._text);
        if (isAtBottom) scrollToBottom();
        break;

      case 'agent_thought_chunk':
        addMsg('thought', text);
        break;

      case 'tool_call':
        currentAgentMsg = null;
        const toolEl = addToolMsg(update.toolName || '?');
        // Store reference for updates
        messagesEl._lastTool = toolEl;
        break;

      case 'tool_call_update':
        if (messagesEl._lastTool) {
          const status = update.status || 'completed';
          updateToolStatus(messagesEl._lastTool, status, update.content ? JSON.stringify(update.content, null, 2) : '');
        }
        break;

      case 'user_message_chunk':
        currentAgentMsg = null;
        if (text) addMsg('user', text);
        break;

      case 'available_commands_update':
        if (sessionId) sendBtn.disabled = false;
        setProcessing(false);
        break;
    }
    return;
  }

  // Reverse call from agent (secondary frontends normally don't get these)
  if (msg.method && msg.id !== undefined) {
    addMsg('system', '[agent: ' + escHtml(msg.method) + ']');
  }
}

// --- User interaction ---

function sendPrompt() {
  const text = promptEl.value.trim();
  if (!text || !sessionId) return;

  currentAgentMsg = null;
  addMsg('user', text);
  promptEl.value = '';
  promptEl.style.height = 'auto';
  setProcessing(true);

  ws.send(JSON.stringify({
    jsonrpc: '2.0',
    id: nextId++,
    method: 'session/prompt',
    params: { sessionId, prompt: [{ type: 'text', text }] }
  }));
}

function cancelPrompt() {
  if (!sessionId) return;
  ws.send(JSON.stringify({
    jsonrpc: '2.0',
    method: 'session/cancel',
    params: { sessionId }
  }));
  setProcessing(false);
  addMsg('system', 'Cancelled');
}

// Enter to send, Shift+Enter for newline
promptEl.onkeydown = (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendPrompt();
  }
};

// Auto-grow textarea
promptEl.oninput = () => {
  promptEl.style.height = 'auto';
  promptEl.style.height = Math.min(promptEl.scrollHeight, 120) + 'px';
};

connect();
</script>
</body>
</html>
